services:
  gtasks-mcp:
    build:
      args:
        MCP_PORT: ${MCP_PORT:-8080}
        UV_BUILDER_IMAGE: ${UV_BUILDER_IMAGE:-docker.io/astral/uv:0.11.16-python3.12-trixie-slim}
    container_name: gtasks-mcp
    env_file:
      - .env
    expose:
      - "${MCP_PORT:-8080}"
    networks:
      - tunnel
    restart: unless-stopped

networks:
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK:-cloudflared}
