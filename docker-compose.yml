services:
  gtasks-mcp:
    build:
      args:
        MCP_PORT: ${MCP_PORT:-8080}
        UV_BUILDER_IMAGE: ${UV_BUILDER_IMAGE:-docker.io/astral/uv:0.11.16-python3.12-trixie-slim}
    container_name: gtasks-mcp
    env_file:
      - .env
    expose:
      - "${MCP_PORT:-8080}"
    ports:
      # Publish on loopback only: the Cloudflare Tunnel (cloudflared) runs on this
      # host and routes tasks.gathmann.co/mcp -> http://localhost:${MCP_PORT}.
      - "127.0.0.1:${MCP_PORT:-8080}:${MCP_PORT:-8080}"
    restart: unless-stopped

