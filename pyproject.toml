[project]
name = "gtasks-mcp"
version = "0.1.0"
description = "Self-hosted streamable-HTTP MCP server wrapping the Google Tasks API v1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4,<5",
    "httpx>=0.28",
]

[project.scripts]
gtasks-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "google_client.py", "auth.py", "find_list_id.py"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
